pool:
  name: Vistara-Agent

trigger:
  branches:
    include:
    - main

pr:
  branches:
    include:
    - main

stages:
- stage: Build
  displayName: Build Stage
  jobs:
  - job: BuildFrontend
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '22.x'

    - script: |
        echo === Node and npm versions ===
        node --version
        npm --version

        echo === Install Dependencies ===
        call npm ci
        if errorlevel 1 exit /b 1

        echo === Run Lint ===
        call npm run lint
        if errorlevel 1 exit /b 1

        echo === Build React App ===
        call npm run build
        if errorlevel 1 exit /b 1

        echo === Verify Build Output ===
        if not exist dist\index.html (
          echo ERROR: dist\index.html was not created
          exit /b 1
        )
        dir dist
      workingDirectory: '$(Build.SourcesDirectory)'
      displayName: Build and Verify

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.SourcesDirectory)/dist'
        artifact: axion-ui-dist

- stage: Deploy
  displayName: Deploy Stage
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployFrontend
    steps:
    - download: current
      artifact: axion-ui-dist

    - task: CopyFilesOverSSH@0
      inputs:
        sshEndpoint: Axion-VM-SSH
        sourceFolder: '$(Pipeline.Workspace)/axion-ui-dist'
        contents: '**'
        targetFolder: '/var/www/axion-ui'
        cleanTargetFolder: false
        overwrite: true

    - task: SSH@0
      inputs:
        sshEndpoint: Axion-VM-SSH
        runOptions: commands
        commands: |
          sudo nginx -t && sudo systemctl reload nginx