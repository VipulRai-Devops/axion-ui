pool: Vistara-Agent

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

stages:
- stage: Build
  displayName: Build React App
  jobs:
  - job: BuildReact
    displayName: Install, Build and Publish
    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: Use Node.js 22
      inputs:
        versionSpec: '22.x'

    - bash: |
        set -e
        echo "=== Node version ==="
        node --version
        npm --version

        echo "=== Install dependencies ==="
        npm ci

        echo "=== Build React application ==="
        npm run build

        echo "=== Verify build output ==="
        test -f dist/index.html
        ls -la dist

        echo "Build completed successfully"
      workingDirectory: $(Build.SourcesDirectory)
      displayName: Install and Build

    - task: PublishPipelineArtifact@1
      displayName: Publish React Artifact
      inputs:
        targetPath: $(Build.SourcesDirectory)/dist
        artifact: axion-ui-dist
        publishLocation: pipeline

- stage: DeployToProd
  displayName: Deploy to Production VM
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - job: DeployProduction
    displayName: Deploy React App
    steps:
    - download: current
      artifact: axion-ui-dist

    - task: CopyFilesOverSSH@0
      displayName: Copy Artifact to VM
      inputs:
        sshEndpoint: Axion-VM-SSH
        sourceFolder: $(Pipeline.Workspace)/axion-ui-dist
        contents: '**'
        targetFolder: /var/www/axion-ui
        cleanTargetFolder: false
        overwrite: true

    - task: SSH@0
      displayName: Validate and Reload Nginx
      inputs:
        sshEndpoint: Axion-VM-SSH
        runOptions: commands
        commands: |
          echo "=== Validate Nginx configuration ==="
          sudo -n nginx -t || exit 1

          echo "=== Reload Nginx ==="
          sudo -n systemctl reload nginx || exit 1

          echo "=== Check Nginx status ==="
          sudo -n systemctl is-active --quiet nginx || exit 1

          echo "Production deployment completed successfully"
