
pool:
  name: Vistara-Agent

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

stages:
- stage: Build
  displayName: Build Stage
  jobs:
  - job: BuildFrontend
    steps:
    - task: NodeTool@0
      displayName: Install, Lint and Build
      inputs:
        versionSpec: '22.x'

    - script: |
        npm ci
        npm run lint
        npm run build
      
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.SourcesDirectory)/dist'
        artifact: axion-ui-dist

- stage: Deploy
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployFrontend
    environment: axion-frontend-dev
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: axion-ui-dist

          - task: Bash@3
            displayName: Deploy to Nginx VM
            inputs:
              targetType: inline
              script: |
                set -e
                SOURCE="$(Pipeline.Workspace)/axion-ui-dist"
                TARGET="/var/www/axion-ui"
                test -f "$SOURCE/index.html"
                sudo mkdir -p "$TARGET"
                sudo cp -a "$SOURCE/." "$TARGET/"
                sudo nginx -t
                sudo systemctl reload nginx
