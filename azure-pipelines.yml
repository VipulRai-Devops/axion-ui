
pool:
  name: Vistara-Agent

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

stages:
- stage: Build
  displayName: Build
  jobs:
  - job: BuildReact
    displayName: Build React App
    steps:
    - checkout: self

    - task: NodeTool@0
      inputs:
        versionSpec: '22.x'

    - script: |
        call npm ci
        if errorlevel 1 exit /b 1
        call npm run build
        if errorlevel 1 exit /b 1
        if not exist dist\index.html exit /b 1
        dir dist
      workingDirectory: '$(Build.SourcesDirectory)'
      displayName: Install and Build

    - task: PublishPipelineArtifact@1
      displayName: Publish Artifact
      inputs:
        targetPath: '$(Build.SourcesDirectory)/dist'
        artifact: axion-ui-dist
        publishLocation: pipeline

- stage: DeployToDev
  displayName: Deploy to VM
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - job: DeployFrontend
    displayName: Deploy Frontend
    steps:
    - download: current
      artifact: axion-ui-dist

    - task: CopyFilesOverSSH@0
      displayName: Copy Artifact to VM
      inputs:
        sshEndpoint: Axion-VM-SSH
        sourceFolder: '$(Pipeline.Workspace)/axion-ui-dist'
        contents: '**'
        targetFolder: '/var/www/axion-ui'
        cleanTargetFolder: false
        overwrite: true

    - task: SSH@0
      displayName: Reload Nginx
      inputs:
        sshEndpoint: Axion-VM-SSH
        runOptions: commands
        commands: |
          sudo -n nginx -t && sudo -n systemctl reload nginx