
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

stages:
- stage: Build
  displayName: Build React App
  jobs:
  - job: BuildReact
    displayName: Install and Build
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self

    - task: NodeTool@0
      inputs:
        versionSpec: '22.x'

    - bash: |
        set -e
        npm ci
        npm run build
        test -f dist/index.html
        echo "Build completed successfully"
      workingDirectory: $(Build.SourcesDirectory)
      displayName: Install and Build

    - task: PublishPipelineArtifact@1
      displayName: Publish Artifact
      inputs:
        targetPath: $(Build.SourcesDirectory)/dist
        artifact: axion-ui-dist
        publishLocation: pipeline

- stage: DeployToProd
  displayName: Deploy to Production VM
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - job: DeployProduction
    displayName: Copy Files and Reload Nginx
    pool:
      name: Vistara-Agent
    steps:
    - download: current
      artifact: axion-ui-dist

    - task: CopyFilesOverSSH@0
      displayName: Copy Artifact to VM
      inputs:
        sshEndpoint: Axion-VM-SSH
        sourceFolder: $(Pipeline.Workspace)/axion-ui-dist
        contents: '**'
        targetFolder: /var/www/axion-ui
        cleanTargetFolder: false
        overwrite: true

    - task: SSH@0
      displayName: Validate and Reload Nginx
      inputs:
        sshEndpoint: Axion-VM-SSH
        runOptions: commands
        commands: |
          set -e
          sudo -n nginx -t
          sudo -n systemctl reload nginx
          sudo -n systemctl is-active nginx
          echo "Production deployment completed successfully"
