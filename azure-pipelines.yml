pool: Vistara-Agent

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

stages:
  # ---------------- CI / BUILD ----------------
- stage: Build
  displayName: Build Axion UI
  jobs:
  - job: BuildFrontend
    displayName: React Build
    steps:
    - task: NodeTool@0
      displayName: Install Node.js
      inputs:
        versionSpec: '22.x'
    - script: |
        node --version
        npm --version
        npm ci
      displayName: Install dependencies
    - script: npm run lint
      displayName: Run ESLint
    - script: npm run build
      displayName: Build React application

    - task: PublishPipelineArtifact@1
      displayName: Publish frontend artifact
      inputs:
        targetPath: '$(Build.SourcesDirectory)/dist'
        artifact: 'axion-ui-dist'
        publishLocation: pipeline

# ---------------- CD / DEPLOY ----------------
- stage: Deploy
  displayName: Deploy Axion UI to Private VM
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployFrontend
    displayName: Deploy to Nginx VM
    environment: axion-frontend-dev
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: axion-ui-dist

          - task: Bash@3
            displayName: Deploy files to Nginx
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                SOURCE="$(Pipeline.Workspace)/axion-ui-dist"
                TARGET="/var/www/axion-ui"
                test -f "$SOURCE/index.html"
                sudo mkdir -p "$TARGET"
                sudo find "$TARGET" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
                sudo cp -a "$SOURCE/." "$TARGET/"
                sudo nginx -t
                sudo systemctl reload nginx

                echo "Axion UI deployment completed."
