pool:
  name: Vistara-Agent

trigger:
  branches:
    include:
    - main

pr:
  branches:
    include:
    - main

stages:
- stage: Build
  displayName: Build Stage
  jobs:
  - job: BuildFrontend
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '22.x'

    - script: |
        @echo on
        echo === STEP 1: Node and npm versions ===
        node --version
        npm --version

        echo === STEP 2: Current directory ===
        cd
        echo Sources: $(Build.SourcesDirectory)
        dir package.json

        echo === STEP 3: Install dependencies ===
        call npm ci
        echo npm ci exit code: %ERRORLEVEL%
        if errorlevel 1 exit /b 1

        echo === STEP 4: Run lint ===
        call npm run lint
        echo lint exit code: %ERRORLEVEL%
        if errorlevel 1 exit /b 1

        echo === STEP 5: Build app ===
        call npm run build
        echo build exit code: %ERRORLEVEL%
        if errorlevel 1 exit /b 1

        echo === STEP 6: Verify dist ===
        if not exist dist\index.html (
          echo ERROR: dist\index.html missing
          exit /b 1
        )
        dir dist
      workingDirectory: '$(Build.SourcesDirectory)'
      displayName: Build and Verify

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.SourcesDirectory)/dist'
        artifact: axion-ui-dist

- stage: Deploy
  displayName: Deploy Stage
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployFrontend
    steps:
    - download: current
      artifact: axion-ui-dist

    - task: CopyFilesOverSSH@0
      inputs:
        sshEndpoint: Axion-VM-SSH
        sourceFolder: '$(Pipeline.Workspace)/axion-ui-dist'
        contents: '**'
        targetFolder: '/var/www/axion-ui'
        cleanTargetFolder: false
        overwrite: true

    - task: SSH@0
      inputs:
        sshEndpoint: Axion-VM-SSH
        runOptions: commands
        commands: |
          sudo nginx -t && sudo systemctl reload nginx