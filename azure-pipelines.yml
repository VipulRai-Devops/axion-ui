pool:
  name: Vistara-Agent

trigger:
  branches:
    include:
    - main

pr:
  branches:
    include:
    - main

stages:
- stage: Build
  displayName: Build Stage
  jobs:
  - job: BuildFrontend
    steps:
    - task: NodeTool@0
      displayName: Install, Build and Verify

      inputs:
        versionSpec: '22.x'

    - script: |
        npm ci
        npm run lint
        npm run build
        if not exist dist\index.html exit /b 1
        dir dist

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.SourcesDirectory)/dist'
        artifact: axion-ui-dist
        publishLocation: pipeline

- stage: Deploy
  displayName: Deploy Stage
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployFrontend
    steps:
    - download: current
      artifact: axion-ui-dist
    - task: Bash@3
      displayName: Deploy to Frontend VM
      inputs:
        targetType: inline
        script: |
          set -e
          SOURCE="$(Pipeline.Workspace)/axion-ui-dist"
          TARGET="/var/www/axion-ui"
          test -f "$SOURCE/index.html"
          sudo mkdir -p "$TARGET"
          sudo find "$TARGET" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          sudo cp -a "$SOURCE/." "$TARGET/"
          sudo nginx -t
          sudo systemctl reload nginx
          echo "Axion UI deployed successfully"