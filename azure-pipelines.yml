
pool:
  name: Vistara-Agent

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

stages:
- stage: Build
  displayName: Build React App
  jobs:
  - job: BuildFrontend
    displayName: Build and Publish
    steps:
    - checkout: self

    - task: NodeTool@0
      inputs:
        versionSpec: '22.x'

    - script: |
        echo === Node and npm versions ===
        node --version
        call npm --version

        echo === Install dependencies ===
        call npm ci
        if errorlevel 1 exit /b 1

        echo === Run lint ===
        call npm run lint
        if errorlevel 1 exit /b 1

        echo === Build production app ===
        call npm run build
        if errorlevel 1 exit /b 1

        echo === Verify dist ===
        if not exist dist\index.html exit /b 1
        dir dist
      workingDirectory: '$(Build.SourcesDirectory)'
      displayName: Build and Verify

    - task: PublishPipelineArtifact@1
      displayName: Publish React Artifact
      inputs:
        targetPath: '$(Build.SourcesDirectory)/dist'
        artifact: axion-ui-dist
        publishLocation: pipeline

- stage: Deploy
  displayName: Deploy to Azure VM
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - job: DeployFrontend
    displayName: Deploy to Nginx
    steps:
    - download: current
      artifact: axion-ui-dist

    - task: CopyFilesOverSSH@0
      displayName: Copy files to Ubuntu VM
      inputs:
        sshEndpoint: Axion-VM-SSH
        sourceFolder: '$(Pipeline.Workspace)/axion-ui-dist'
        contents: '**'
        targetFolder: '/var/www/axion-ui'
        cleanTargetFolder: false
        overwrite: true
        readyTimeout: '20000'

    - task: SSH@0
      displayName: Validate and Reload Nginx
      inputs:
        sshEndpoint: Axion-VM-SSH
        runOptions: commands
        commands: |
          sudo -n nginx -t && sudo -n systemctl reload nginx
          echo Deployment completed
