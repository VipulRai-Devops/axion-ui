
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

stages:
# ==========================================
# STAGE 1: BUILD REACT APPLICATION
# ==========================================
- stage: Build
  displayName: Build React App

  jobs:
  - job: BuildReact
    displayName: Install, Build and Publish

    pool:
      name: 'Vistara-Agent'

    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: Use Node.js 22
      inputs:
        versionSpec: '22.x'

    - powershell: |
        $ErrorActionPreference = 'Stop'

        Write-Host "=== Node version ==="
        node --version
        if ($LASTEXITCODE -ne 0) {
          throw "Node.js is not available"
        }

        Write-Host "=== npm version ==="
        npm --version
        if ($LASTEXITCODE -ne 0) {
          throw "npm is not available"
        }

        Write-Host "=== Install dependencies ==="
        npm ci
        if ($LASTEXITCODE -ne 0) {
          throw "npm ci failed"
        }

        Write-Host "=== Build React application ==="
        npm run build
        if ($LASTEXITCODE -ne 0) {
          throw "npm run build failed"
        }

        Write-Host "=== Verify build output ==="
        if (!(Test-Path "dist/index.html")) {
          throw "dist/index.html was not generated"
        }

        Get-ChildItem dist
        Write-Host "Build completed successfully"
      workingDirectory: '$(Build.SourcesDirectory)'
      displayName: Install and Build

    - task: PublishPipelineArtifact@1
      displayName: Publish React Artifact
      inputs:
        targetPath: '$(Build.SourcesDirectory)/dist'
        artifact: 'axion-ui-dist'
        publishLocation: 'pipeline'


# ==========================================
# STAGE 2: DEPLOY TO AZURE VM
# ==========================================
- stage: DeployToProd
  displayName: Deploy to Production VM

  dependsOn: Build

  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))

  jobs:
  - job: DeployProduction
    displayName: Deploy React App

    pool:
      name: 'Vistara-Agent'

    steps:
    - checkout: none

    - download: current
      artifact: axion-ui-dist

    - task: CopyFilesOverSSH@0
      displayName: Copy Build Files to VM
      inputs:
        sshEndpoint: 'Axion-VM-SSH'
        sourceFolder: '$(Pipeline.Workspace)/axion-ui-dist'
        contents: '**'
        targetFolder: '/var/www/axion-ui'
        cleanTargetFolder: false
        overwrite: true

    - task: SSH@0
      displayName: Validate and Reload Nginx
      inputs:
        sshEndpoint: 'Axion-VM-SSH'
        runOptions: 'commands'
        commands: |
          sudo -n nginx -t 2>&1 && sudo -n systemctl reload nginx && sudo -n systemctl is-active nginx && echo "Production deployment completed successfully"
